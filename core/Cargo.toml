[package]
name = "sharedclip-core"
version.workspace = true
edition.workspace = true
description = "Shared Clipboard core: identity, pairing, protocol and transfers, for every app"

[lib]
name = "sharedclip"
crate-type = ["lib", "staticlib", "cdylib"]

# Generates the Swift and Kotlin bindings: cargo run -p sharedclip-core --features bindgen --bin uniffi-bindgen -- ...
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
uniffi = { version = "0.32.2", features = ["tokio"] }
thiserror = "2"
iroh = { version = "1.4", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
data-encoding = "2"
rand = "0.10"
if-addrs = "0.15"

[dev-dependencies]
tempfile = "3"

# ponytail: libc 0.2.190 made `in6_ifreq` macOS-only, but netdev 0.46 (iroh's netwatch) uses it on iOS too. Drop this
# pin once netdev or libc fixes that.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "=0.2.189"

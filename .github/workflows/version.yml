# Makes versions from the commits since the last release, as VERSIONING.md ("How it is set up") says; the logic is in
# .github/version.sh. In short, from commit subjects:
#   "type!:" or "BREAKING" → a release now: 2.0.0 after 1.4.2
#   "feat:"                → a release now: 1.5.0
#   anything else          → a beta now: 1.4.3-beta.N, released as 1.4.3 by the nightly run
#   docs:, ci:, test:, and commits that change only docs and CI files → nothing
# It runs after CI passes on a push to main, so a version is only made from a commit that passed. The first release,
# 1.0.0, is made by hand: Run workflow with bump major.
name: Version

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      bump:
        description: auto, or a release with the number picked by hand
        type: choice
        options: [auto, major, minor, patch]
        default: auto

permissions:
  contents: write # push the release commit and tags, make draft releases
  actions: write # read CI runs, start release.yml

# One at a time, so two runs can't make the same version.
concurrency:
  group: version
  cancel-in-progress: false

jobs:
  version:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI passed, not a newer one that it hasn't checked yet.
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0
      - run: .github/version.sh
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump || 'auto' }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
